<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ad Generator</title>

  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Vue 3 importmap -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.esm-browser.js"
    }
  }
  </script>

  <style>
    /* ---- Reset & base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0d12;
      --surface:   #181a22;
      --surface2:  #1f2230;
      --border:    #2a2d3e;
      --text:      #e2e5f0;
      --text-muted:#8a8fa8;
      --accent:    #6366f1;
      --accent-h:  #4f46e5;
      --success:   #10b981;
      --danger:    #ef4444;
      --radius:    8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ---- App shell ---- */
    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }

    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .app-nav { display: flex; gap: 4px; }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: var(--radius);
      transition: background 0.15s, color 0.15s;
    }
    .nav-tab:hover  { background: var(--surface2); color: var(--text); }
    .nav-tab.active { background: var(--accent); color: #fff; }

    .app-main {
      flex: 1;
      padding: 32px 16px;
    }

    /* ---- Wizard ---- */
    .wizard {
      max-width: 760px;
      margin: 0 auto;
    }

    .step-nav {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      margin-bottom: 32px;
    }

    .step-nav::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }

    .step-pip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 1;
      flex: 1;
    }

    .pip-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .pip-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .step-pip.active .pip-circle { background: var(--accent); border-color: var(--accent); color: #fff; }
    .step-pip.active .pip-label  { color: var(--accent); }
    .step-pip.done .pip-circle   { background: var(--success); border-color: var(--success); color: #fff; }
    .step-pip.done .pip-label    { color: var(--success); }

    .wizard-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }

    /* ---- Steps shared ---- */
    .step-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .step-desc {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .section-heading {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 24px 0 12px;
    }
    .section-heading:first-of-type { margin-top: 0; }

    .step-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .action-group { display: flex; gap: 10px; }

    /* ---- Forms ---- */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field.full-width { grid-column: 1 / -1; }
    .form-field.inline { flex-direction: row; align-items: center; gap: 10px; }
    .form-field.inline .field-label { white-space: nowrap; min-width: 80px; }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hint {
      font-weight: 400;
      font-style: italic;
    }

    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      padding: 8px 12px;
      width: 100%;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 72px; }

    .char-count { font-size: 11px; font-weight: 400; color: var(--text-muted); }
    .char-count.over { color: var(--danger); }

    .errors-box { margin-top: 12px; }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; }

    /* ---- Buttons ---- */
    .btn {
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 20px;
      transition: opacity 0.15s, background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary   { background: var(--accent);  color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }

    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--border); }

    .btn-back { background: none; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-back:hover { color: var(--text); border-color: var(--text-muted); }

    .btn-next { background: var(--accent); color: #fff; }
    .btn-next:hover:not(:disabled) { background: var(--accent-h); }

    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: 0.85; }

    .btn-sm {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      white-space: nowrap;
    }

    /* ---- Spinner ---- */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-msg {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* ---- Step 1: Image ---- */
    .prompt-preview {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 13px;
      color: var(--text-muted);
      margin: 16px 0;
    }
    .prompt-label { font-weight: 600; color: var(--text-muted); margin-right: 6px; }
    .prompt-text  { color: var(--text); font-style: italic; }

    .generate-btn { margin-bottom: 16px; }

    .image-preview {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .image-preview img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ---- Step 2: Template ---- */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 8px;
    }

    @media (max-width: 480px) {
      .template-grid { grid-template-columns: 1fr; }
    }

    .template-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .template-card:hover   { border-color: var(--accent); }
    .template-card.selected { border-color: var(--accent); }

    .template-thumb {
      height: 80px;
      position: relative;
      overflow: hidden;
    }

    /* Left-right layout */
    .template-thumb[data-layout="left-right"] {
      display: flex;
    }
    .template-thumb[data-layout="left-right"] .tt-img {
      width: 58%;
      background: linear-gradient(135deg, #2c7873, #6fb3b8);
    }
    .template-thumb[data-layout="left-right"] .tt-text {
      flex: 1;
      background: #2d4f38;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .template-thumb[data-layout="left-right"] .tt-text::after {
      content: '';
      display: block;
      width: 60%;
      height: 40%;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }

    /* Top-bottom layout */
    .template-thumb[data-layout="top-bottom"] {
      display: flex;
      flex-direction: column;
    }
    .template-thumb[data-layout="top-bottom"] .tt-img {
      height: 55%;
      background: linear-gradient(135deg, #2c7873, #6fb3b8);
    }
    .template-thumb[data-layout="top-bottom"] .tt-text {
      flex: 1;
      background: #2d4f38;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .template-thumb[data-layout="top-bottom"] .tt-text::after {
      content: '';
      display: block;
      width: 55%;
      height: 35%;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }

    /* Overlay layout */
    .template-thumb[data-layout="overlay"] {
      background: linear-gradient(135deg, #2c7873, #6fb3b8);
    }
    .template-thumb[data-layout="overlay"] .tt-img {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1a4a5c 0%, #6fb3b8 100%);
    }
    .template-thumb[data-layout="overlay"] .tt-text {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .template-thumb[data-layout="overlay"] .tt-text::after {
      content: '';
      display: block;
      width: 50%;
      height: 50%;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
    }

    .template-label {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface2);
    }
    .template-card.selected .template-label { color: var(--accent); }

    .size-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .size-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s;
    }
    .size-option:hover { border-color: var(--accent); }
    .size-option input[type="radio"] { accent-color: var(--accent); }

    .custom-size {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
    .custom-size input { width: 120px; }

    .size-display {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ---- Step 4: Style presets ---- */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 480px) {
      .preset-grid { grid-template-columns: 1fr; }
    }

    .preset-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .preset-card:hover    { border-color: var(--accent); }
    .preset-card.selected { border-color: var(--accent); }

    .preset-swatch {
      height: 90px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ps-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ps-accent {
      display: inline-block;
      width: 20px;
      height: 4px;
      border-radius: 2px;
    }

    .ps-text {
      font-size: 14px;
      font-weight: 700;
    }

    .ps-cta {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      align-self: flex-start;
    }

    .preset-name {
      background: var(--surface2);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .preset-card.selected .preset-name { color: var(--accent); }

    /* ---- Preview & Export ---- */
    .preview-wrap {
      margin: 16px 0;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #111;
      padding: 8px;
    }

    .banner-canvas {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      border-radius: 4px;
    }

    .export-btns {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .exported-badge {
      font-size: 13px;
      color: var(--success);
      font-weight: 600;
    }

    /* ---- Gallery ---- */
    .gallery {
      max-width: 1000px;
      margin: 0 auto;
    }

    .gallery-header {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .gallery-header h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .gallery-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-tabs { display: flex; gap: 4px; }

    .filter-tab {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      transition: all 0.15s;
    }
    .filter-tab:hover  { border-color: var(--accent); color: var(--text); }
    .filter-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .gallery-actions { display: flex; gap: 10px; }

    .gallery-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .gallery-empty p  { margin-bottom: 16px; font-size: 16px; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .gallery-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      transition: border-color 0.15s;
    }
    .gallery-card:hover { border-color: var(--accent); }

    .card-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 2;
    }
    .gallery-card:hover .card-delete { opacity: 1; }
    .card-delete:hover { background: var(--danger); }

    .card-thumb {
      aspect-ratio: 3/1;
      background: var(--bg);
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .card-body { padding: 12px; }

    .card-headline {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tag-input {
      flex: 1;
      padding: 5px 8px;
      font-size: 13px;
    }

    .tag-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--accent);
      border-radius: 20px;
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
      padding: 2px 10px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/app.js"></script>

  <script>
    // Version sentinel — bump after every code change
    window.V = '1'
  </script>
</body>
</html>
